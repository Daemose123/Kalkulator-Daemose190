name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Set Java 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" \
            -O /tmp/cmdline-tools.zip

          unzip -q /tmp/cmdline-tools.zip \
            -d "$SDK/cmdline-tools"

          mv \
            "$SDK/cmdline-tools/cmdline-tools" \
            "$SDK/cmdline-tools/latest"

          # Compatibility untuk Buildozer versi lama
          ln -s "$SDK/cmdline-tools/latest" "$SDK/tools"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/licenses"

          printf '%s\n' \
            "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e0" \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$SDK/licenses/android-sdk-license"

          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "build-tools;37.0.0"

      - name: Verify SDK
        shell: bash
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=== SDK ==="
          ls -la "$SDK"

          echo "=== sdkmanager ==="
          "$SDK/tools/bin/sdkmanager" --version

          echo "=== Build Tools ==="
          ls -la "$SDK/build-tools"

          echo "=== AIDL ==="
          find "$SDK/build-tools" -name aidl -type f

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer
          python3 -m pip install "cython==0.29.37"

      - name: Clean project build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Restore Android SDK compatibility
        shell: bash
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          if [ ! -e "$SDK/tools" ]; then
            ln -s "$SDK/cmdline-tools/latest" "$SDK/tools"
          fi

          mkdir -p "$SDK/licenses"

          printf '%s\n' \
            "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e0" \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$SDK/licenses/android-sdk-license"

      - name: Build APK
        shell: bash
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kalkulator-apk
          path: bin/*.apk
          if-no-files-found: error
