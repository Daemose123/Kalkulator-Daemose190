name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Set Java
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

      - name: Install Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" \
            -O /tmp/cmdline-tools.zip

          unzip -q /tmp/cmdline-tools.zip \
            -d "$ANDROID_HOME/cmdline-tools"

          mv \
            "$ANDROID_HOME/cmdline-tools/cmdline-tools" \
            "$ANDROID_HOME/cmdline-tools/latest"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME/licenses"

          yes | sdkmanager --licenses || true

          printf '%s\n' \
            "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            "d56f5187479451eabf01fb78af6dfcb131a648e0" \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

          echo "Installed Build-Tools:"
          ls -la "$ANDROID_HOME/build-tools"

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer
          python3 -m pip install "cython==0.29.37"

      - name: Clean Buildozer
        run: |
          rm -rf "$HOME/.buildozer"
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        shell: bash
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"

          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kalkulator-apk
          path: bin/*.apk
          if-no-files-found: error
