name: Build Android APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-22.04

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Install system dependencies
    run: |
      sudo apt update
      sudo apt install -y \
        git \
        zip \
        unzip \
        wget \
        openjdk-17-jdk \
        python3-pip \
        autoconf \
        automake \
        libtool \
        pkg-config \
        zlib1g-dev \
        libncurses5-dev \
        libncursesw5-dev \
        cmake \
        libffi-dev \
        libssl-dev

  - name: Set Java 17
    run: |
      echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

  - name: Install Android SDK Command Line Tools
    run: |
      mkdir -p "$HOME/android-sdk/cmdline-tools"

      wget -q \
        https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
        -O /tmp/cmdline-tools.zip

      unzip -q /tmp/cmdline-tools.zip \
        -d "$HOME/android-sdk/cmdline-tools"

      mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" \
        "$HOME/android-sdk/cmdline-tools/latest"

      echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
      echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

      echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
      echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

  - name: Install Android SDK packages
    run: |
      yes | sdkmanager --licenses || true

      sdkmanager \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"

  - name: Install Buildozer
    run: |
      python3 -m pip install --upgrade pip
      python3 -m pip install buildozer
      python3 -m pip install "cython==0.29.37"

  - name: Clean previous Buildozer files
    run: |
      rm -rf .buildozer
      rm -rf bin

  - name: Build APK
    run: |
      buildozer android debug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: kalkulator-apk
      path: bin/*.apk
```
